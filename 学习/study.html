<!DOCTYPE html>
<html lang="zh-CN">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>学习</title>
        <style>
            /*HTML Body CSS样式*/
            body {
                font-family: Arial, sans-serif;/*设置页面主体的字体族 */
                line-height: 1.6;/*设置行高，控制文本行间距，值为字体大小的 1.6 倍。*/
                margin: 20px;/*页面边距，body 四周都留出 20px 的空白。*/
                background-color: oklab(90.751% -0.00771 -0.02373);/*设置背景颜色 */
            }
            /*HTML Heading 1 CSS样式*/
            h1 {
                color: #333;/*设置标题颜色为深灰色*/
                text-align: center;/*设置标题文本居中对齐 */
            }
        </style>
    </head>
    <body>
        <h1>学习</h1>
        <p>学习是一个持续的过程，通过不断地获取知识和技能，我们能够不断成长和进步。无论是在学校、工作还是生活中，学习都是不可或缺的一部分。通过学习，我们可以开拓视野、提升能力，并且更好地适应不断变化的世界。</p>
        <p>学习不仅仅是为了获得知识，更是为了培养思维能力和解决问题的能力。通过学习，我们能够学会如何分析问题、提出解决方案，并且在实践中不断改进和创新。</p>
        <p>无论你是在学习新的技能、掌握新的知识，还是在追求个人成长，保持积极的学习态度都是非常重要的。通过持续学习，我们可以不断提升自己，实现更高的目标，并且过上更加充实和有意义的生活。</p>
        <img src="./media/bird.png" alt="学习图片" style="max-width: auto; height: auto;" title="小鸟">
        <video src="./media/xiaomi car.mp4" controls poster="./media/xiaomi car.png" width="700px" autoplay title="小米汽车"></video>
    </body>
</html>
